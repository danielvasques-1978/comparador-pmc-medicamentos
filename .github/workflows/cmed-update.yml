name: Atualização CMED

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci
      - run: pip install -r requirements.txt

      - name: Rodar os testes
        run: |
          pytest -q
          node --test

      - name: Atualizar a base
        id: update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +e
          python -m scripts.update_cmed
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          test "$code" != "1"

      - name: Commitar a edição nova
        run: |
          if [ -n "$(git status --porcelain src/data/medicines.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/medicines.json
            git commit -m "Update CMED price table"
            git push
          else
            echo "Nenhuma alteração na base."
          fi

      - name: Avisar se faltaram colunas de Preço Fábrica
        if: steps.update.outputs.code == '2'
        run: |
          echo "A edição foi publicada, mas a planilha da CMED não trouxe colunas de Preço Fábrica."
          echo "O grupo de uso restrito hospitalar não entrou nesta edição."
          exit 1
